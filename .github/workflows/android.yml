name: Build HandOff APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk HandOff.apk
          "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)" verify --verbose HandOff.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HandOff-Android
          path: HandOff.apk
